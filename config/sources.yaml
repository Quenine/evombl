sources:
  - BLDB
  - ChEMBL
  - BindingDB
  - PubChem BioAssay
  - NCBI Protein
  - NCBI Nucleotide
  - RCSB PDB
  - Crossref
  - Europe PMC
  - primary literature
  - supplementary information
  - patents
  - collaborator-generated data
metadata_retrieval:
  enabled: true
  official_apis_only: true
  preserve_raw_captures: true
  permit_scientific_promotion: false
  permit_activity_ingestion: false
  permit_pdf_download: false
  permit_publisher_scraping: false
  policy_version: metadata-retrieval-v1
