[project]
name = "evombl"
version = "0.1.0"
description = "Variant-resolved evidence infrastructure for metallo-beta-lactamase inhibitor research"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "biopython>=1.84",
  "duckdb>=1.1",
  "httpx>=0.27,<1",
  "pandas>=2.2",
  "pint>=0.24,<1",
  "pyarrow>=17",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "rdkit>=2024.3,<2025",
  "tenacity>=9,<10",
  "typer>=0.12",
]

[project.scripts]
evombl = "evombl.cli:app"

[dependency-groups]
dev = ["mypy>=1.11", "pre-commit>=3.8", "pytest>=8.3", "ruff>=0.6", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evombl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["evombl"]

